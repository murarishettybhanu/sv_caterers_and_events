name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/configure-pages@v5

      # Prerenders every route to static HTML under /<repo>/ — Pages serves files only.
      - name: Build
        run: bun run build:pages
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ${{ github.event.repository.name }}

      - name: Add .nojekyll
        run: touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
